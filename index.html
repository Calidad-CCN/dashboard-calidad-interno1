<style>
:root{
  --cn-primary:#0066CC; --cn-secondary:#003366; --cn-red:#FF3333;
  --bg:#F7F9FC; --surface:#FFFFFF; --text:#1E293B; --muted:#64748B; --border:#E2E8F0;
  --ok:#10B981; --warn:#F59E0B; --danger:#EF4444;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Carlito',Calibri,'Segoe UI',Arial,sans-serif;font-size:15px;color:var(--text);background:var(--bg);line-height:1.45}
h1,h2,h3,h4{font-family:'DM Sans','Segoe UI',Arial,sans-serif;color:var(--cn-secondary);margin:0 0 .5rem}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}h4{font-size:.95rem}
a{color:var(--cn-primary)}
button,select,input,textarea{font-family:inherit;font-size:.95rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--cn-primary);background:var(--cn-primary);color:#fff;border-radius:8px;padding:.45rem .9rem;cursor:pointer;text-decoration:none;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--cn-primary)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text);font-weight:400}
.btn.sm{padding:.25rem .6rem;font-size:.85rem}
.btn.danger{background:var(--danger);border-color:var(--danger)}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:700;font-size:.85rem;margin:.6rem 0 .25rem;color:var(--muted)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;box-shadow:0 2px 8px rgba(0,51,102,.05)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#F1F5F9;color:var(--cn-secondary);text-align:left;font-family:'DM Sans',Arial,sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:.02em}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FBFF}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.b-ok{background:#D1FAE5;color:#065F46}.b-warn{background:#FEF3C7;color:#92400E}.b-danger{background:#FEE2E2;color:#991B1B}.b-info{background:#DBEAFE;color:#1E40AF}.b-neutral{background:#F1F5F9;color:#475569}
.bar{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%}
/* Topbar */
.topbar{background:var(--cn-secondary);color:#fff;padding:.6rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar img{height:36px;display:block}
.topbar .app{font-family:'DM Sans',Arial,sans-serif;font-size:.9rem;opacity:.85;border-left:1px solid rgba(255,255,255,.3);padding-left:1rem}
.topbar select{width:auto;min-width:230px;background:#fff}
.usermenu{position:relative}
.usermenu>button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:.35rem .8rem;cursor:pointer}
.usermenu .menu{display:none;position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--border);border-radius:8px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.usermenu.open .menu{display:block}
.usermenu .menu a{display:block;padding:.6rem .9rem;color:var(--text);text-decoration:none}
.usermenu .menu a:hover{background:#F1F5F9}
.banner{background:#FEF3C7;color:#78350F;padding:.45rem 1.2rem;font-size:.85rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
main{max-width:1280px;margin:0 auto;padding:1.4rem 1.2rem 3rem}
.crumbs{font-size:.85rem;margin-bottom:.8rem}.crumbs a{text-decoration:none}
/* Módulos */
.mod{display:block;text-decoration:none;color:inherit;border-left:4px solid var(--cn-primary);transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod .n{font-family:'DM Sans',Arial,sans-serif;font-weight:700;color:var(--cn-secondary)}
/* Tabs */
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--border);margin-bottom:1rem;flex-wrap:wrap}
.tabs a{padding:.55rem .9rem;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--cn-primary);border-color:var(--cn-primary)}
/* Velocímetros */
.gauge-card{text-align:center}
.gauge-card h4{text-transform:uppercase;font-size:.82rem;letter-spacing:.03em;min-height:2.3em}
.gauge-card svg{width:100%;max-width:230px;height:auto}
/* Login */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:linear-gradient(160deg,#F7F9FC 0%,#E6EEF8 100%)}
.auth .card{width:100%;max-width:420px;padding:2rem}
.auth img{width:150px;display:block;margin:0 auto 1rem}
.notice{background:#FEF3C7;border:1px solid #FDE68A;color:#78350F;border-radius:8px;padding:.6rem .8rem;font-size:.85rem;margin:.8rem 0}
.err{color:var(--danger);font-size:.85rem;margin-top:.4rem}
.kpi{font-family:'DM Sans',Arial,sans-serif;font-size:1.6rem;font-weight:700;color:var(--cn-secondary)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:.35rem .7rem;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on-c{background:#D1FAE5;color:#065F46;font-weight:700}
.seg button.on-n{background:#FEE2E2;color:#991B1B;font-weight:700}
.seg button.on-a{background:#E2E8F0;color:#334155;font-weight:700}
.cert{border:2px solid var(--cn-secondary);border-radius:var(--radius);padding:1.4rem;background:#fff;position:relative}
.cert .marca{position:absolute;top:1rem;right:1rem}
.mono{font-family:Consolas,'Courier New',monospace;font-size:.82rem;word-break:break-all}
.dropzone{border:2px dashed #93C5FD;border-radius:var(--radius);padding:1rem;text-align:center;background:#F8FBFF}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1rem}
@media print{.topbar,.banner,.noprint{display:none!important}main{padding:0}}
</style>
</head>

<footer class="noprint">Maqueta de demostración — todos los datos son ficticios. No ingresar datos reales de pacientes.</footer>

/* =========================================================
   Utilidades
   ========================================================= */
const esc = (valor) => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (num, den) => den ? Math.round((num / den) * 1000) / 10 : 0;
const fmtPct = (v) => v.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
const pad = (n, l) => String(n).padStart(l, '0');
const isoHoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; };
const fmtFecha = (iso) => { if (!iso) return '—'; const [a,m,d] = iso.split('-'); return `${d}/${m}/${a}`; };
const normalizar = (texto) => String(texto ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();

function semillaDesdeTexto(texto){ let h = 2166136261; for (const c of texto){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(semilla){ return function(){ semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function esDiaHabil(iso){
  const d = new Date(iso + 'T12:00:00');
  const dia = d.getDay();
  if (dia === 0 || dia === 6) return false;
  return !S.feriados.some(f => f.fecha === iso);
}
function sumarDiasHabiles(isoInicio, dias){
  const d = new Date(isoInicio + 'T12:00:00');
  let contados = 0;
  while (contados < dias){
    d.setDate(d.getDate() + 1);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
    if (esDiaHabil(iso)) contados++;
  }
  return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
}
function diasHabilesEntre(isoDesde, isoHasta){
  // Días hábiles desde isoDesde (excluido) hasta isoHasta (incluido); negativo si isoHasta < isoDesde
  if (isoHasta === isoDesde) return 0;
  const signo = isoHasta > isoDesde ? 1 : -1;
  const [a, b] = signo > 0 ? [isoDesde, isoHasta] : [isoHasta, isoDesde];
  const d = new Date(a + 'T12:00:00'); let n = 0;
  while (true){
    d.setDate(d.getDate() + 1);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
    if (iso > b) break;
    if (esDiaHabil(iso)) n++;
  }
  return n * signo;
}

// Versión de cálculo de plazo usada antes de cargar el estado (con feriados base)
function sumarDiasHabilesBase(isoInicio, dias){
  const feriados = new Set(FERIADOS_BASE.map(f => f.fecha));
  const d = new Date(isoInicio + 'T12:00:00'); let c = 0;
  while (c < dias){ d.setDate(d.getDate()+1); const iso = `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; const w = d.getDay(); if (w!==0 && w!==6 && !feriados.has(iso)) c++; }
  return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
}

function indicadoresSucursal(codigo){
  const base = {
    RM01:{total:[34,48], obligatorios:[8,12], calidad:[26,35], gerencia:[21,33]},
    RM02:{total:[39,48], obligatorios:[11,12], calidad:[30,35], gerencia:[27,33]},

    RM04:{total:[44,48], obligatorios:[12,12], calidad:[33,35], gerencia:[30,33]}
  };
  if (base[codigo]) return base[codigo];
  const suc = S.sucursales.find(s => s.codigo === codigo);
  if (!suc || suc.estado !== 'Activa') return null;
  const r = mulberry32(semillaDesdeTexto('ind-' + codigo));
  return {total:[20+Math.floor(r()*28),48], obligatorios:[6+Math.floor(r()*6),12], calidad:[18+Math.floor(r()*17),35], gerencia:[15+Math.floor(r()*18),33]};
}
function indicadoresVista(){
  if (sucursalVista() !== 'RED') return indicadoresSucursal(sucursalVista());
  const acum = {total:[0,0], obligatorios:[0,0], calidad:[0,0], gerencia:[0,0]};
  S.sucursales.forEach(s => { const i = indicadoresSucursal(s.codigo); if (!i) return; Object.keys(acum).forEach(k => { acum[k][0] += i[k][0]; acum[k][1] += i[k][1]; }); });
  return acum;
}
function valorIndicador(codigoInd, codigoSuc){
  const auditoria = codigoInd === 'REG-1.2' && S.auditorias[codigoSuc];
  if (auditoria) return auditoria.resultado;
  const criticos = codigoInd === 'AOC-1.2' && S.criticos && S.criticos.porSucursal[codigoSuc];
  if (criticos && criticos.total) return pct(criticos.notificados, criticos.total);
  const r = mulberry32(semillaDesdeTexto(codigoInd + codigoSuc));
  return Math.round((40 + r() * 60) * 10) / 10;
}

/* =========================================================
   Velocímetro vectorial (escala 0-100, franjas de color, aguja y valor)
   ========================================================= */
function puntoEnDial(cx, cy, radio, valor){
  const angulo = (225 - 270 * Math.min(Math.max(valor,0),100) / 100) * Math.PI / 180;
  return [cx + radio * Math.cos(angulo), cy - radio * Math.sin(angulo)];
}
function arcoDial(cx, cy, radio, desde, hasta){
  const [x1,y1] = puntoEnDial(cx, cy, radio, desde), [x2,y2] = puntoEnDial(cx, cy, radio, hasta);
  const grande = (hasta - desde) * 2.7 > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${radio} ${radio} 0 ${grande} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function velocimetro(valor, franjas, id){
  const cx = 110, cy = 112, colores = {rojo:'#E5484D', amarillo:'#F5C518', verde:'#2FB463'};
  let s = `<svg viewBox="0 0 220 216" role="img" aria-label="Valor ${fmtPct(valor)}">
  <defs>
    <radialGradient id="bisel${id}" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="80%" stop-color="#E9EDF2"/><stop offset="100%" stop-color="#C9D1DB"/></radialGradient>
    <linearGradient id="aro${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D5DBE3"/><stop offset="100%" stop-color="#9AA5B4"/></linearGradient>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="100" fill="url(#aro${id})"/>
  <circle cx="${cx}" cy="${cy}" r="93" fill="url(#bisel${id})"/>`;
  franjas.forEach(([desde, hasta, color]) => {
    s += `<path d="${arcoDial(cx,cy,80,desde,hasta)}" fill="none" stroke="${colores[color]}" stroke-width="12"/>`;
  });
  for (let v = 0; v <= 100; v += 2){
    const mayor = v % 10 === 0;
    const [x1,y1] = puntoEnDial(cx,cy, mayor ? 88 : 86, v), [x2,y2] = puntoEnDial(cx,cy, mayor ? 72 : 74, v);
    s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${mayor ? '#3A4250' : 'rgba(40,40,40,.45)'}" stroke-width="${mayor ? 1.6 : .8}"/>`;
    if (mayor){
      const [lx,ly] = puntoEnDial(cx,cy,60,v);
      s += `<text x="${lx.toFixed(2)}" y="${(ly+3.5).toFixed(2)}" text-anchor="middle" font-size="10" font-family="Georgia,serif" fill="#4B5563">${v}</text>`;
    }
  }
  const [nx,ny] = puntoEnDial(cx,cy,70,valor), [tx,ty] = puntoEnDial(cx,cy,-10,valor);
  s += `<line x1="${tx.toFixed(2)}" y1="${ty.toFixed(2)}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cy}" r="6" fill="#111827"/><circle cx="${cx}" cy="${cy}" r="2" fill="#9CA3AF"/>
  <rect x="${cx-30}" y="${cy+28}" width="60" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="${cx}" y="${cy+43}" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#374151">${fmtPct(valor)}</text>
  </svg>`;
  return s;
}

function oportunidad(t){
  if (t.estado === 'Cerrado por GC'){
    return t.fechaRespuesta && t.fechaRespuesta <= t.fechaLimite ? {texto:'Respondido en plazo', clase:'b-ok'} : {texto:'Respondido fuera de plazo', clase:'b-danger'};
  }
  const restantes = diasHabilesEntre(isoHoy(), t.fechaLimite);
  if (restantes < 0) return {texto:`Vencido hace ${-restantes} días hábiles`, clase:'b-danger'};
  if (restantes <= 3) return {texto:`Quedan ${restantes} días hábiles`, clase:'b-warn'};
  return {texto:`Quedan ${restantes} días hábiles`, clase:'b-info'};
}
function migas(items){
  return `<div class="crumbs noprint"><a href="#/dashboard">Inicio</a>${items.map(([texto, ruta]) => ruta ? ` / <a href="${ruta}">${esc(texto)}</a>` : ` / <span class="muted">${esc(texto)}</span>`).join('')}</div>`;
}
function encabezadoModulo(titulo, subtitulo){
  const vista = sucursalVista() === 'RED' ? 'Consolidado red Cruz Nacional' : nombreSucursal(sucursalVista());
  return `<div class="row" style="margin-bottom:1rem"><div><h1>${esc(titulo)}</h1><div class="muted">${esc(subtitulo)}</div></div><span class="spacer"></span><span class="badge b-info">${esc(vista)}</span></div>`;
}
function barra(valor, umbral){
  const color = valor >= umbral ? 'var(--ok)' : valor >= umbral * 0.85 ? 'var(--warn)' : 'var(--danger)';
  return `<div class="bar"><span style="width:${Math.min(valor,100)}%;background:${color}"></span></div>`;
}
// Borradores: cualquier campo con data-borrador conserva lo escrito al cambiar de pantalla o presionar Atrás
function restaurarBorradores(){
  document.querySelectorAll('[data-borrador]').forEach(campo => {
    const clave = campo.dataset.borrador;
    if (S.borradores[clave] !== undefined) campo.value = S.borradores[clave];
    campo.addEventListener('input', () => { S.borradores[clave] = campo.value; guardarEstado(); });
  });
}
function limpiarBorradores(prefijo){ Object.keys(S.borradores).forEach(k => { if (k.startsWith(prefijo)) delete S.borradores[k]; }); }

/* =========================================================
   Enrutador (hash): el botón Atrás del navegador vuelve a la vista anterior
   ========================================================= */
const RUTAS_PUBLICAS = ['login','registro'];
function rutaActual(){ return (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/'); }
function navegar(ruta){ location.hash = '#/' + ruta; }

function render(){
  const [seccion, ...resto] = rutaActual();
  const app = document.getElementById('app');
  if (!S.usuario && !RUTAS_PUBLICAS.includes(seccion)){ navegar('login'); return; }
  if (S.usuario && RUTAS_PUBLICAS.includes(seccion)){ navegar('dashboard'); return; }
  if (seccion === 'login'){ app.innerHTML = vistaLogin(); enlazarLogin(); return; }
  if (seccion === 'registro'){ app.innerHTML = vistaRegistro(); enlazarRegistro(); return; }
  if (seccion === 'administracion' && !permisos().admin){ navegar('dashboard'); return; }

  const vistas = {
    dashboard: vistaDashboard, acreditacion: vistaAcreditacion, seremi: vistaSeremi, gcl: vistaGCL,
    documental: vistaDocumental, paciente: vistaPaciente, contraloria: vistaContraloria,
    perfil: vistaPerfil, administracion: vistaAdministracion
  };
  const vista = vistas[seccion] || vistaDashboard;
  let contenido;
  try { contenido = vista(resto); }
  catch (error){
    console.error('Error al construir la vista', seccion, error);
    contenido = `<div class="card"><h2>No se pudo mostrar esta sección</h2><p class="muted">${esc(error.message)}</p><a class="btn" href="#/dashboard">Volver al inicio</a></div>`;
  }
  app.innerHTML = vistaMarco(contenido);
  enlazarMarco();
  restaurarBorradores();
  const enlazadores = {dashboard:null, acreditacion:enlazarAcreditacion, paciente:enlazarPaciente, gcl:enlazarGCL, contraloria:enlazarContraloria, administracion:enlazarAdministracion, documental:enlazarDocumental};
  if (enlazadores[seccion]) enlazadores[seccion](resto);
  window.scrollTo(0,0);
}

function enlazarLogin(){
  const entrar = () => {
    const usuario = document.getElementById('lgUsuario').value.trim();
    const clave = document.getElementById('lgClave').value;
    if (!usuario || !clave){ document.getElementById('lgError').textContent = 'Ingresa usuario y clave.'; return; }
    const registrado = S.usuariosRegistrados.find(u => u.usuario === usuario || u.correo === usuario);
    S.usuario = registrado || {nombre:'Usuario de demostración', usuario, correo: usuario.includes('@') ? usuario : usuario + '@cruznacional.cl', cargo:'Enfermera de Gestión Clínica y Calidad', rol:'Calidad', sucursal:'RM01', sis:''};
    S.sucursalActiva = 'RED'; S.vistaSimulada = null;
    guardarEstado(); navegar('dashboard');
  };
  document.getElementById('lgEntrar').addEventListener('click', entrar);
  document.getElementById('lgClave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
}
function vistaRegistro(){
  return `<div class="auth"><div class="card" style="max-width:520px">

    <h2 style="text-align:center">Registro de usuario</h2>

      <div><label>Usuario</label><input id="rgUsuario" data-borrador="registro.usuario"></div>

function enlazarRegistro(){
  restaurarBorradores();
  document.getElementById('rgCrear').addEventListener('click', () => {
    const valor = id => document.getElementById(id).value.trim();
    const error = document.getElementById('rgError');
    if (!valor('rgNombre') || !valor('rgUsuario') || !valor('rgCorreo') || !document.getElementById('rgClave').value){ error.textContent = 'Completa nombre, usuario, correo y clave.'; return; }
    if (!/^[^\s@]+@cruznacional\.cl$/i.test(valor('rgCorreo'))){ error.textContent = 'El correo debe terminar en @cruznacional.cl.'; return; }
    const cargo = valor('rgCargo');
    const rol = (CARGOS.find(([c]) => c === cargo) || [,'TENS / Enfermera'])[1];
    const nuevo = {nombre:valor('rgNombre'), usuario:valor('rgUsuario'), correo:valor('rgCorreo').toLowerCase(), cargo, rol, sucursal:valor('rgSucursal'), sis:valor('rgSis')};
    S.usuariosRegistrados.push(nuevo);
    S.usuario = nuevo; S.sucursalActiva = 'RED'; S.vistaSimulada = null;
    limpiarBorradores('registro.'); guardarEstado(); navegar('dashboard');
  });
}

/* =========================================================
   Marco de la aplicación (barra superior, selector de sucursal, menú)
   ========================================================= */
function vistaMarco(contenido){
  const p = permisos(), perfil = perfilEfectivo();
  const selector = p.global
    ? `<select id="selSucursal" aria-label="Sucursal"><option value="RED">Consolidado red (todas las sucursales)</option>${S.sucursales.map(s => `<option value="${esc(s.codigo)}" ${S.sucursalActiva===s.codigo?'selected':''}>${esc(s.codigo+' '+s.nombre)}${s.estado!=='Activa'?' — '+esc(s.estado):''}</option>`).join('')}</select>`
    : `<span class="badge b-neutral">${esc(nombreSucursal(perfil.sucursal))}</span>`;
  const banner = S.vistaSimulada ? `<div class="banner">Vista simulada: <strong>${esc(S.vistaSimulada.rol)}</strong> — ${esc(nombreSucursal(S.vistaSimulada.sucursal))}<button class="btn sm sec" id="btnSalirSimulacion">Volver a mi vista</button></div>` : '';
  return `<header class="topbar">
      <a href="#/dashboard" aria-label="Inicio"><img src="${LOGO_BLANCO_H}" alt="Clínica Cruz Nacional"></a>
      <span class="app">Calidad y Acreditación</span>
      <span class="spacer"></span>
      ${selector}
      <div class="usermenu" id="menuUsuario"><button id="btnMenu">${esc(S.usuario.nombre)} · ${esc(perfil.rol)}</button>
        <div class="menu"><a href="#/perfil">Mi perfil</a>${p.admin ? '<a href="#/administracion">Administración</a>' : ''}<a href="#" id="btnSalir">Cerrar sesión</a></div></div>
    </header>${banner}<main>${contenido}</main>`;
}
function enlazarMarco(){
  const sel = document.getElementById('selSucursal');
  if (sel){ sel.value = S.sucursalActiva; sel.addEventListener('change', () => { S.sucursalActiva = sel.value; guardarEstado(); render(); }); }
  const menu = document.getElementById('menuUsuario');
  document.getElementById('btnMenu').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', () => menu.classList.remove('open'), {once:true});
  document.getElementById('btnSalir').addEventListener('click', e => { e.preventDefault(); S.usuario = null; S.vistaSimulada = null; guardarEstado(); navegar('login'); });
  const salirSim = document.getElementById('btnSalirSimulacion');
  if (salirSim) salirSim.addEventListener('click', () => { S.vistaSimulada = null; guardarEstado(); render(); });
}

  const codigos = vista === 'RED' ? S.sucursales.filter(s => s.estado === 'Activa').map(s => s.codigo) : [vista];
  let cuerpo = '';
  const cumplimientoAmbito = (amb, cod) => { const r = mulberry32(semillaDesdeTexto(amb[0] + cod)); return Math.min(amb[2], Math.round(amb[2] * (0.55 + r() * 0.45))); };
  if (tab === 'pauta'){
    cuerpo = `<div class="card"><h3>Ámbitos del estándar general de acreditación</h3><p class="small muted">Características evaluadas y cumplidas por ámbito. Datos de ejemplo.</p><div class="table-wrap"><table><thead><tr><th>Ámbito</th><th>Nombre</th><th>Características</th><th>Cumplidas</th><th style="width:25%">Cumplimiento</th></tr></thead><tbody>
      ${AMBITOS.map(a => { const tot = a[2] * codigos.length; const cum = codigos.reduce((s,c) => s + cumplimientoAmbito(a,c), 0); const v = pct(cum, tot);
        return `<tr><td><strong>${a[0]}</strong></td><td>${esc(a[1])}</td><td>${tot}</td><td>${cum}</td><td>${barra(v,100)}<span class="small">${fmtPct(v)}</span></td></tr>`; }).join('')}
    </tbody></table></div></div>`;
  } else if (tab === 'indicadores'){
    cuerpo = `<div class="card"><div class="row"><h3>Indicadores de acreditación</h3><span class="spacer"></span><span class="small muted">Indicadores de ejemplo</span></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Indicador</th><th>Tipo</th><th>Umbral</th>${codigos.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${INDICADORES.map(i => `<tr><td><strong>${esc(i.codigo)}</strong></td><td>${esc(i.nombre)}</td><td>${i.obligatorio ? '<span class="badge b-danger">Obligatorio</span>' : '<span class="badge b-neutral">General</span>'}</td><td>≥ ${i.umbral}%</td>
        ${codigos.map(c => { const v = valorIndicador(i.codigo, c); return `<td><span class="badge ${v >= i.umbral ? 'b-ok' : 'b-danger'}">${fmtPct(v)}</span></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></div>
    <div class="card" style="margin-top:1rem"><h3>Ingreso de datos mensuales</h3>
      <div class="grid g4"><div><label>Indicador</label><select data-borrador="acred.ind">${INDICADORES.map(i => `<option>${esc(i.codigo)}</option>`).join('')}</select></div>
      <div><label>Mes</label><input type="month" data-borrador="acred.mes"></div>
      <div><label>Numerador</label><input type="number" min="0" id="acNum" data-borrador="acred.num"></div>
      <div><label>Denominador</label><input type="number" min="1" id="acDen" data-borrador="acred.den"></div></div>
      <div class="row" style="margin-top:.8rem"><button class="btn" id="acCalcular">Calcular resultado</button><span id="acResultado" class="muted"></span></div>
      <p class="small muted">En la maqueta el cálculo es demostrativo y no modifica los indicadores mostrados.</p></div>`;
  } else {
    const obligatorias = [['DP 1.1','Respeto a la privacidad durante la atención'],['DP 4.1','Consentimiento informado'],['CAL 1.1','Programa de mejoría continua de la calidad'],['GCL 1.2','Evaluación pre-procedimiento'],['GCL 2.2','Prevención de eventos adversos'],['AOC 1.2','Notificación de resultados críticos'],['RH 1.1','Habilitación de profesionales'],['REG 1.2','Registro de ficha clínica'],['EQ 2.1','Programa de mantenimiento de equipos'],['INS 3.1','Plan de emergencias'],['AP 1.1','Laboratorio clínico externo con convenio'],['AP 4.1','Imagenología: protección radiológica']];
    cuerpo = `<div class="card"><h3>Características obligatorias (exigencia 100%)</h3><div class="table-wrap"><table><thead><tr><th>Característica</th><th>Descripción</th>${codigos.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${obligatorias.map(([cod, desc]) => `<tr><td><strong>${esc(cod)}</strong></td><td>${esc(desc)}</td>${codigos.map(c => { const ok = mulberry32(semillaDesdeTexto(cod + c))() > 0.25; return `<td>${ok ? '<span class="badge b-ok">Cumple</span>' : '<span class="badge b-danger">No cumple</span>'}</td>`; }).join('')}</tr>`).join('')}

function enlazarAcreditacion(){
  const btn = document.getElementById('acCalcular');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const n = Number(document.getElementById('acNum').value), d = Number(document.getElementById('acDen').value);
    const salida = document.getElementById('acResultado');
    if (!d || n < 0 || n > d){ salida.textContent = 'Revisa los valores: el numerador debe estar entre 0 y el denominador.'; return; }
    salida.textContent = `Resultado: ${fmtPct(pct(n,d))}`;
  });
}

/* =========================================================
   2. Visita SEREMI
   ========================================================= */
function vistaSeremi([tab = 'documentos']){
  const vista = sucursalVista();
  const codigos = vista === 'RED' ? S.sucursales.filter(s => s.estado === 'Activa').map(s => s.codigo) : [vista];
  const docs = [['Resolución sanitaria de autorización — sala de procedimientos',0],['Autorización de instalación radiológica',0],['Autorizaciones de desempeño de operadores de rayos X',1],['Plan de manejo de REAS (DS N° 6)',1],['Patente comercial',1],['Certificados de mantención de equipos',1],['Resolución sanitaria box dental',2]];
  let cuerpo;
  if (tab === 'documentos'){
    const filas = [];
    codigos.forEach(c => docs.forEach(([nombre, tipo]) => {
      if (tipo === 2 && c !== 'RM01') return;
      const r = mulberry32(semillaDesdeTexto(nombre + c));
      const emision = new Date(); emision.setDate(emision.getDate() - Math.floor(r() * 900));
      const vence = new Date(emision); vence.setFullYear(vence.getFullYear() + (tipo === 0 ? 3 : 1));
      const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
      const dias = Math.round((vence - new Date()) / 86400000);
      const estado = tipo === 2 ? ['En trámite','b-info'] : dias < 0 ? ['Vencido','b-danger'] : dias < 60 ? ['Por renovar','b-warn'] : ['Vigente','b-ok'];

      <p>Al recibir a la Autoridad Sanitaria, el personal debe solicitar la identificación de los fiscalizadores y dar aviso inmediato al Gerente de Sucursal y al Área Clínica y Calidad. La carpeta de fiscalización de esta plataforma reúne la documentación vigente para exhibirla sin demora.</p>
      <p>Durante la visita se acompaña a los fiscalizadores, se responde solo lo consultado y se registra cada documento entregado o solicitado. Si algún antecedente no está disponible, se informa la fecha comprometida de entrega.</p>
      <p>Al finalizar, se revisa el acta antes de firmarla, se solicita copia y se carga en la sección de actas para su seguimiento.</p>
      <p class="small muted">Texto de ejemplo. El contenido definitivo debe validarse con el protocolo institucional vigente.</p></div>`;
  } else {
    cuerpo = `<div class="card"><h3>Actas de fiscalización anteriores</h3><div class="table-wrap"><table><thead><tr><th>Sucursal</th><th>Fecha</th><th>Materia</th><th>Resultado</th><th>Seguimiento</th></tr></thead><tbody>
      ${codigos.map((c,i) => `<tr><td>${esc(c)}</td><td>${fmtFecha(`2026-0${(i%8)+1}-1${i}`)}</td><td>${['Inspección general','Protección radiológica','Manejo de REAS','Infraestructura'][i%4]}</td><td><span class="badge ${i%3?'b-ok':'b-warn'}">${i%3?'Sin observaciones':'Con observaciones'}</span></td><td>${i%3?'—':'Plan de acción en curso'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  }
  return `${migas([['Visita SEREMI']])}${encabezadoModulo('Visita SEREMI','Carpeta de fiscalización de la Autoridad Sanitaria')}
    <div class="tabs">${[['documentos','Documentación obligatoria'],['guia','Guía para el personal'],['actas','Actas de fiscalización']].map(([k,t]) => `<a href="#/seremi/${k}" class="${tab===k?'on':''}">${t}</a>`).join('')}</div>${cuerpo}`;
}

function detalleIncidencia(codigo){
  const i = S.incidencias.find(x => x.codigo === codigo);

  return `<div class="grid g2"><div class="card"><h3>${esc(i.codigo)}</h3>

      <div class="row" style="margin-top:.8rem"><button class="btn" id="btnResolverInc" data-codigo="${esc(i.codigo)}" ${i.estado==='Resuelto'?'disabled':''}>Marcar como resuelto</button><a class="btn ghost" href="#/gcl/incidencias">Volver</a></div></div></div>`;
}
function enlazarGCL([tab]){
  if (tab !== 'incidencias') return;
  document.querySelectorAll('#tablaInc tr[data-ir]').forEach(tr => tr.addEventListener('click', () => navegar(tr.dataset.ir)));
  const filtrar = () => {
    const area = document.getElementById('filtroIncArea')?.value || '', estado = document.getElementById('filtroIncEstado')?.value || '';
    document.querySelectorAll('#tablaInc tr[data-ir]').forEach(tr => { tr.style.display = (!area || tr.dataset.area === area) && (!estado || tr.dataset.estado === estado) ? '' : 'none'; });
  };
  ['filtroIncArea','filtroIncEstado'].forEach(id => document.getElementById(id)?.addEventListener('change', filtrar));
  filtrar();
  const btn = document.getElementById('btnResolverInc');
  if (btn) btn.addEventListener('click', () => {
    const inc = S.incidencias.find(x => x.codigo === btn.dataset.codigo);
    inc.respuesta = S.borradores['inc.resp.' + inc.codigo] ?? inc.respuesta;
    inc.estado = 'Resuelto'; delete S.borradores['inc.resp.' + inc.codigo];
    guardarEstado(); render();
  });
}

function leerTabla(texto){
  const lineas = texto.replace(/\r/g,'').split('\n').filter(l => l.trim());
  if (!lineas.length) return [];
  const sep = (lineas[0].match(/;/g) || []).length >= (lineas[0].match(/,/g) || []).length ? ';' : ',';
  const partir = l => { const out = []; let actual = '', comillas = false; for (const c of l){ if (c === '"'){ comillas = !comillas; } else if (c === sep && !comillas){ out.push(actual); actual = ''; } else actual += c; } out.push(actual); return out.map(x => x.trim()); };
  const encabezado = partir(lineas[0]);
  return lineas.slice(1).map(l => { const celdas = partir(l); const o = {}; encabezado.forEach((h, i) => o[h] = celdas[i] ?? ''); return o; });
}
async function leerArchivo(archivo){
  const nombre = archivo.name.toLowerCase();
  if (nombre.endsWith('.xlsx') || nombre.endsWith('.xls')){
    if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar el lector de Excel. Revisa la conexión o usa un archivo CSV.');
    const buffer = await archivo.arrayBuffer();
    const libro = XLSX.read(buffer, {type:'array', cellDates:true});
    const filas = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]], {raw:false, defval:''});
    return {filas, buffer};
  }
  const texto = await archivo.text();
  return {filas: leerTabla(texto), buffer: new TextEncoder().encode(texto)};
}
async function huellaSHA256(buffer){
  if (!window.crypto?.subtle) return 'No disponible en este navegador';
  const digest = await crypto.subtle.digest('SHA-256', buffer);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2,'0')).join('');
}
const buscarColumna = (encabezados, patrones) => encabezados.find(h => patrones.some(p => normalizar(h).includes(p)));
async function procesarMuestreo(filas, buffer, nombreArchivo){
  const error = document.getElementById('fcError');
  if (!filas.length){ error.textContent = 'El archivo no contiene registros.'; return; }
  const encabezados = Object.keys(filas[0]);
  const colTipo = buscarColumna(encabezados, ['TIPO']);
  const colId = buscarColumna(encabezados, ['SAM','ATENCION','FICHA','FOLIO']) || encabezados[0];
  const colFecha = buscarColumna(encabezados, ['FECHA']);
  const filtradas = colTipo ? filas.filter(f => normalizar(f[colTipo]).includes('URGENCIA')) : filas;
  if (filtradas.length < TAMANO_MUESTRA_FICHAS){ error.textContent = `El universo filtrado tiene ${filtradas.length} registros; se requieren al menos ${TAMANO_MUESTRA_FICHAS}.`; return; }
  const hash = await huellaSHA256(buffer);
  const semillaNum = crypto.getRandomValues ? crypto.getRandomValues(new Uint32Array(1))[0] : Math.floor(Math.random() * 4294967295);
  const rnd = mulberry32(semillaNum);
  const indices = filtradas.map((_, i) => i);
  for (let i = indices.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
  const seleccion = indices.slice(0, TAMANO_MUESTRA_FICHAS).sort((a,b) => a - b);
  const ahora = new Date();
  S.muestreo = {
    sucursal: document.getElementById('fcSucursal').value, periodo: document.getElementById('fcPeriodo').value,
    archivo: nombreArchivo, fechaHora: ahora.toLocaleString('es-CL'), universo: filas.length, filtrado: filtradas.length,
    semilla: semillaNum.toString(16).padStart(8,'0'), hash, actual: 0,
    fichas: seleccion.map(i => ({posicion: i + 1, id: String(filtradas[i][colId] || `Registro ${i+1}`), fecha: colFecha ? String(filtradas[i][colFecha]) : '', items: ITEMS_FICHA.map(() => '')}))
  };
  guardarEstado(); render();
}

function identificarSucursal(texto){
  const t = normalizar(texto);
  if (!t) return 'SIN';
  const s = S.sucursales.find(s => [s.codigo, s.nombre, s.comuna, ...(s.alias || [])].some(n => n && (t === normalizar(n) || t.includes(normalizar(n)))));
  return s ? s.codigo : 'SIN';
}
function procesarCriticos(filas, nombreArchivo){
  const error = document.getElementById('crError');
  if (!filas.length){ error.textContent = 'El archivo no contiene registros.'; return; }
  const encabezados = Object.keys(filas[0]);
  const colSuc = buscarColumna(encabezados, ['SUCURSAL','CENTRO','SEDE']);
  if (!colSuc){ error.textContent = 'No se encontró una columna "Sucursal" en el archivo.'; return; }
  const colNotif = buscarColumna(encabezados, ['NOTIFIC']);
  const porSucursal = {};
  filas.forEach(f => {
    const cod = identificarSucursal(f[colSuc]);
    porSucursal[cod] = porSucursal[cod] || {total:0, notificados:0};
    porSucursal[cod].total++;
    if (colNotif && ['SI','S','1','TRUE'].includes(normalizar(f[colNotif]))) porSucursal[cod].notificados++;
  });
  S.criticos = {archivo:nombreArchivo, columna:colSuc, porSucursal};
  guardarEstado(); render();
}

    const texto = generarArchivoAltasEjemplo();
    try { await procesarMuestreo(leerTabla(texto), new TextEncoder().encode(texto), 'reporte_pacientes_alta_ejemplo.csv'); }
    catch (error){ console.error(error); document.getElementById('fcError').textContent = 'No se pudo generar la muestra: ' + error.message; }
  });
  document.getElementById('fcDescargarEjemplo').addEventListener('click', () => descargarTexto('reporte_pacientes_alta_ejemplo.csv', generarArchivoAltasEjemplo()));
  const m = S.muestreo; if (!m) return;
  document.getElementById('fcReiniciar').addEventListener('click', () => { S.muestreo = null; guardarEstado(); render(); });
  document.querySelectorAll('.seg[data-item] button').forEach(b => b.addEventListener('click', () => {
    m.fichas[m.actual].items[Number(b.parentElement.dataset.item)] = b.dataset.v; guardarEstado(); render();
  }));
  document.getElementById('fcAnterior').addEventListener('click', () => { m.actual--; guardarEstado(); render(); });
  document.getElementById('fcSiguiente').addEventListener('click', () => { m.actual++; guardarEstado(); render(); });
  document.getElementById('fcFinalizar').addEventListener('click', () => {
    const cumplen = m.fichas.filter(f => f.items.every(v => v !== 'No cumple')).length;
    S.auditorias[m.sucursal] = {resultado: pct(cumplen, m.fichas.length), fecha: isoHoy()};
    guardarEstado();
    document.getElementById('fcMensaje').textContent = `REG-1.2 registrado para ${nombreSucursal(m.sucursal)}: ${fmtPct(pct(cumplen, m.fichas.length))}. Se refleja en Indicadores y en el Inicio.`;
  });
}

      <div><label>Código</label><input id="adCodigo" placeholder="RM06" data-borrador="adm.codigo"></div>
      <div><label>Nombre</label><input id="adNombre" data-borrador="adm.nombre"></div>
      <div><label>Comuna</label><input id="adComuna" data-borrador="adm.comuna"></div>
      <div><label>Estado</label><select id="adEstado" data-borrador="adm.estado"><option>Activa</option><option>Por abrir</option><option>Inactiva</option></select></div>
      <div><label>Correo gerente</label><input id="adCorreo" data-borrador="adm.correo"></div>
      <div><label>Alias (separados por coma)</label><input id="adAlias" data-borrador="adm.alias"></div></div>
      <div id="adError" class="err"></div>
      <div class="row" style="margin-top:.8rem"><button class="btn" id="adGuardar">Guardar sucursal</button><button class="btn ghost" id="adLimpiar">Limpiar</button></div></div>`;
  } else if (tab === 'usuarios'){
    const demo = [
      {nombre:S.usuario.nombre, cargo:S.usuario.cargo, rol:S.usuario.rol, sucursal:S.usuario.sucursal, propio:true},
      ...S.usuariosRegistrados.filter(u => u.usuario !== S.usuario.usuario).map(u => ({...u})),
      {nombre:'Usuario demo 1', cargo:'Gerente de Sucursal', rol:'Gerente de Sucursal', sucursal:'RM02'},
      {nombre:'Usuario demo 2', cargo:'Gerente de Sucursal', rol:'Gerente de Sucursal', sucursal:'RM03'},
      {nombre:'Usuario demo 3', cargo:'Jefa de Clínicas', rol:'Jefa de Clínicas', sucursal:'RM01'},
      {nombre:'Usuario demo 4', cargo:'Gerente General', rol:'Gerencia', sucursal:'RM01'},
      {nombre:'Usuario demo 5', cargo:'Médico', rol:'Médico', sucursal:'RM04'}
    ];
    cuerpo = `<div class="card"><h3>Usuarios y roles</h3><p class="small muted">"Ver como" permite revisar lo que ve cada rol. Un Gerente de Sucursal solo ve su sucursal.</p><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Cargo</th><th>Rol</th><th>Sucursal</th><th>Alcance</th><th></th></tr></thead><tbody>
      ${demo.map(u => `<tr><td>${esc(u.nombre)}${u.propio?' <span class="badge b-info">Tú</span>':''}</td><td>${esc(u.cargo)}</td><td>${esc(u.rol)}</td><td>${esc(nombreSucursal(u.sucursal))}</td><td>${ROLES[u.rol]?.global ? 'Global' : 'Solo su sucursal'}</td><td>${u.propio ? '' : `<button class="btn sm sec" data-vercomo="${esc(u.rol)}|${esc(u.sucursal)}">Ver como</button>`}</td></tr>`).join('')}

      ${[['Calidad','Editar','Editar','Editar','Editar','Editar y revisar','Editar','Sí'],['Gerencia','Ver','Ver','Ver','Ver y aprobar','Ver','Ver','No'],['Jefa de Clínicas','Editar','Ver','Editar','Ver','Ver y revisar','Editar','No'],['Gerente de Sucursal','Su sucursal','Su sucursal','Su sucursal','Ver','Su sucursal','Su sucursal','No'],['Médico','—','—','—','Protocolos clínicos','—','—','No'],['TENS / Enfermera','—','—','Checklists','Ver','—','—','No']].map(r => `<tr>${r.map((c,i) => i===0?`<td><strong>${esc(c)}</strong></td>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}

}
function enlazarAdministracion([tab = 'sucursales']){
  if (tab === 'sucursales'){
    const campos = {adCodigo:'codigo', adNombre:'nombre', adComuna:'comuna', adEstado:'estado', adCorreo:'correo'};
    document.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => {
      const s = S.sucursales.find(x => x.codigo === b.dataset.editar);
      Object.entries(campos).forEach(([id, k]) => { document.getElementById(id).value = s[k] || ''; S.borradores['adm.' + k] = s[k] || ''; });
      document.getElementById('adAlias').value = (s.alias || []).join(', ');
      document.getElementById('adCodigo').disabled = true;
      document.getElementById('tituloFormSuc').textContent = 'Editar sucursal ' + s.codigo;
    }));
    document.getElementById('adLimpiar').addEventListener('click', () => { limpiarBorradores('adm.'); guardarEstado(); render(); });
    document.getElementById('adGuardar').addEventListener('click', () => {
      const v = id => document.getElementById(id).value.trim();
      const codigo = v('adCodigo').toUpperCase();
      if (!/^[A-Z]{2}\d{2}$/.test(codigo)){ document.getElementById('adError').textContent = 'El código debe tener el formato RM06 (dos letras y dos números).'; return; }
      if (!v('adNombre')){ document.getElementById('adError').textContent = 'Ingresa el nombre de la sucursal.'; return; }
      const datos = {codigo, nombre:v('adNombre'), comuna:v('adComuna'), estado:v('adEstado'), correo:v('adCorreo'), alias:v('adAlias').split(',').map(a => a.trim()).filter(Boolean)};
      const existente = S.sucursales.find(s => s.codigo === codigo);
      if (existente && !document.getElementById('adCodigo').disabled){ document.getElementById('adError').textContent = 'Ya existe una sucursal con ese código.'; return; }
      if (existente) Object.assign(existente, datos); else { S.sucursales.push(datos); S.correlativos[codigo] = 0; }
      limpiarBorradores('adm.'); guardarEstado(); render();
    });
  } else if (tab === 'usuarios'){
    document.querySelectorAll('[data-vercomo]').forEach(b => b.addEventListener('click', () => {
      const [rol, sucursal] = b.dataset.vercomo.split('|');
      S.vistaSimulada = {rol, sucursal}; guardarEstado();
      if (ROLES[rol]?.admin) render(); else navegar('dashboard');
    }));
  } else {
    document.getElementById('frAgregar').addEventListener('click', () => {
      const fecha = document.getElementById('frFecha').value, nombre = document.getElementById('frNombre').value.trim();
      if (!fecha || !nombre){ document.getElementById('frError').textContent = 'Ingresa fecha y nombre.'; return; }
      if (S.feriados.some(f => f.fecha === fecha)){ document.getElementById('frError').textContent = 'Esa fecha ya está registrada.'; return; }
      S.feriados.push({fecha, nombre}); guardarEstado(); render();
    });
    document.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', () => { S.feriados = S.feriados.filter(f => f.fecha !== b.dataset.quitar); guardarEstado(); render(); }));
  }
}
